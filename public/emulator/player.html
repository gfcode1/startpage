<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emulator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
#player{width:100%;height:100%}
#loading{
position:absolute;inset:0;
display:flex;align-items:center;justify-content:center;
color:#666;font:14px/1.4 sans-serif;flex-direction:column;gap:12px;
background:#000
}
.spinner{
width:24px;height:24px;
border:2px solid #333;border-top-color:#e74c3c;
border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading">
<div class="spinner"></div>
<span>Loading emulator…</span>
</div>
<div id="player"></div>
<script>
(function(){
var l=document.getElementById('loading');

function loadRom(c){
window.EJS_player='#player';
window.EJS_core=c.core;
window.EJS_gameName=c.title||'';
window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
window.EJS_startOnLoaded=true;
if(c.romUrl){
window.EJS_gameUrl=c.romUrl;
}else if(c.romData){
var b=new Blob([c.romData]);
window.EJS_gameUrl=URL.createObjectURL(b);
}else{return}
l.style.display='none';
var s=document.createElement('script');
s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
s.onerror=function(){
l.style.display='flex';
l.innerHTML='<span style="color:#e74c3c">Errore: EmulatorJS non trovato</span>';
};
document.body.appendChild(s);
}

window.addEventListener('message',function(e){
var m=e.data;
if(!m||m.type!=='load-rom')return;
loadRom(m);
});
window.parent.postMessage({type:'emulator-ready'},'*');
})();
</script>
</body>
</html>
